packages:
  - apps/*
  - packages/*

# One version of each shared dependency for the whole repo.
# Packages reference these with "catalog:".
catalog:
  '@fontsource-variable/big-shoulders': ^5.3.0
  '@fontsource-variable/instrument-sans': ^5.3.0
  '@fontsource-variable/martian-mono': ^5.3.0
  '@modelcontextprotocol/server': ^2.4.0
  '@redocly/cli': ^2.72.1
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/devtools-vite': 0.8.6
  '@tanstack/eslint-config': 0.4.0
  '@tanstack/react-devtools': 0.10.14
  '@tanstack/react-query': ^5.105.0
  '@tanstack/react-router': 1.170.46
  '@tanstack/react-router-devtools': 1.167.2
  '@tanstack/react-router-ssr-query': 1.167.3
  '@tanstack/react-start': 1.169.4
  '@tanstack/router-cli': ^1.132.0
  '@types/node': ^26.6.6
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^6.0.1
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  eslint: 10.13.0
  lucide-react: ^1.66.0
  nitro: 3.0.260610-beta
  radix-ui: ^1.8.1
  tailwind-merge: ^3.7.0
  tw-animate-css: ^1.4.0
  openapi-fetch: ^0.17.0
  openapi-typescript: ^7.13.0
  prettier: ^3.8.1
  react-dom: ^19.2.0
  react: ^19.2.0
  tailwindcss: ^4.3.3
  turbo: ^2.11.10
  typescript: ^6.0.2
  vite: ^8.0.0
  zod: ^4.6.7

# Dependencies allowed to run install scripts. Everything else is blocked.
allowBuilds:
  esbuild: true
  lightningcss: true
  # The prebuilt native binding ships as an optional dependency, so its postinstall is not needed.
  unrs-resolver: false

peerDependencyRules:
  allowedVersions:
    # openapi-typescript only uses the compiler API, which is unchanged in TypeScript 6.
    openapi-typescript>typescript: '6'

# pnpm refuses packages published less than a day ago (minimumReleaseAge).
# These pins keep the lockfile on releases that have passed that window.
overrides:
  electron-to-chromium: 1.5.468
  node-releases: 2.0.62
  seroval: 1.7.5
  tslib: 2.8.1
  ws: 8.22.0
