# easy-sys-admin on one Docker host behind Traefik.
#
#   cp deploy/.env.example deploy/.env    # fill it in
#   docker compose -f deploy/compose.yaml --env-file deploy/.env -p esa up -d --build
#
# Only the web container is published (through Traefik). It serves the
# board, the MCP endpoint, and proxies /api, /auth, and /enroll to the
# control plane on the internal network. PostgreSQL sits on its own network
# with no outside access, shared only with the control plane.
name: ${ESA_STACK_NAME:-esa}

services:
  postgres:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      POSTGRES_DB: esa
      POSTGRES_USER: esa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U esa -d esa']
      interval: 10s
      timeout: 5s
      retries: 10

  esa:
    build:
      context: ..
      dockerfile: apps/esa/Dockerfile
      args:
        VERSION: ${ESA_VERSION:-dev}
        COMMIT: ${ESA_COMMIT:-none}
    image: esa-control-plane:${ESA_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ESA_DATABASE_URL: postgres://esa:${POSTGRES_PASSWORD}@postgres:5432/esa?sslmode=disable
      ESA_PUBLIC_URL: ${ESA_PUBLIC_URL:?set ESA_PUBLIC_URL}
      ESA_MASTER_KEY: ${ESA_MASTER_KEY:?set ESA_MASTER_KEY}
      ESA_AUTH_MODE: standard
      ESA_AUTH_PASSWORD: ${ESA_AUTH_PASSWORD:-true}
      ESA_SIGNUP: ${ESA_SIGNUP:-false}
      # Empty leaves the control plane default: private addresses are refused
      # while sign-up is open and allowed while it is closed.
      ESA_ALLOW_PRIVATE_NETWORKS: ${ESA_ALLOW_PRIVATE_NETWORKS:-}
      ESA_ALLOWED_EMAILS: ${ESA_ALLOWED_EMAILS:-}
      ESA_OIDC_ISSUER: ${ESA_OIDC_ISSUER:-}
      ESA_OIDC_CLIENT_ID: ${ESA_OIDC_CLIENT_ID:-}
      ESA_OIDC_CLIENT_SECRET: ${ESA_OIDC_CLIENT_SECRET:-}
      ESA_OIDC_PROVIDER_NAME: ${ESA_OIDC_PROVIDER_NAME:-Authentik}
      ESA_GOOGLE_CLIENT_ID: ${ESA_GOOGLE_CLIENT_ID:-}
      ESA_GOOGLE_CLIENT_SECRET: ${ESA_GOOGLE_CLIENT_SECRET:-}
      ESA_SMTP_HOST: ${ESA_SMTP_HOST:-}
      ESA_SMTP_PORT: ${ESA_SMTP_PORT:-}
      ESA_SMTP_USERNAME: ${ESA_SMTP_USERNAME:-}
      ESA_SMTP_PASSWORD: ${ESA_SMTP_PASSWORD:-}
      ESA_SMTP_FROM: ${ESA_SMTP_FROM:-}
      # Empty leaves the control plane defaults (see docs/configuration.md).
      ESA_POLL_CONCURRENCY: ${ESA_POLL_CONCURRENCY:-}
      ESA_MAX_SERVERS_PER_ACCOUNT: ${ESA_MAX_SERVERS_PER_ACCOUNT:-}
      # true on the hosted beta. Unset or false leaves the self-host caps.
      ESA_BETA_LIMITS: ${ESA_BETA_LIMITS:-}
      ESA_METRICS_RAW_RETENTION: ${ESA_METRICS_RAW_RETENTION:-}
      ESA_METRICS_HOURLY_RETENTION: ${ESA_METRICS_HOURLY_RETENTION:-}
    # The control plane SSHs out to managed servers, including this host by
    # its public address, so it needs normal outbound networking.
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [internal, database]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: esa-web:${ESA_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      esa:
        condition: service_healthy
    environment:
      ESA_API_URL: http://esa:8080
      # Origin the MCP endpoint accepts from browsers.
      ESA_PUBLIC_URL: ${ESA_PUBLIC_URL:?set ESA_PUBLIC_URL}
      # Same switches as the control plane, so the public page states the caps and sign-up that are in force.
      ESA_BETA_LIMITS: ${ESA_BETA_LIMITS:-}
      ESA_SIGNUP: ${ESA_SIGNUP:-false}
      ESA_SEO: ${ESA_SEO:-false}
      # Shown next to the Source code link. Empty keeps the defaults in the web app.
      ESA_VERSION: ${ESA_VERSION:-dev}
      ESA_COMMIT: ${ESA_COMMIT:-none}
      ESA_SOURCE_URL: ${ESA_SOURCE_URL:-https://github.com/infinit3HQ/easy-sys-admin}
    networks: [internal, proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - traefik.http.routers.${ESA_ROUTER:-esa}.rule=Host(`${ESA_HOST:?set ESA_HOST}`)
      - traefik.http.routers.${ESA_ROUTER:-esa}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${ESA_ROUTER:-esa}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-cloudflare}
      - traefik.http.services.${ESA_ROUTER:-esa}.loadbalancer.server.port=3000

volumes:
  postgres:

networks:
  internal:
  database:
    internal: true
  proxy:
    name: ${TRAEFIK_NETWORK:-proxy}
    external: true
