name: Deploy

# Builds the images on the server and restarts the stack with compose.
# Runs on the self-hosted runner on Server_One, under its own user.
#
# Pushes to main deploy only after CI passes and when the repository
# variable DEPLOY_ENABLED is "true". "Run workflow" deploys on demand.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.DEPLOY_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, esa-deploy]
    environment: production
    env:
      # Lives on the server only (mode 600). See deploy/.env.example.
      ENV_FILE: ${{ vars.DEPLOY_ENV_FILE || '/home/easysysadmin/esa/deploy.env' }}
      COMPOSE_PROJECT_NAME: esa
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Check the server env file
        run: test -r "$ENV_FILE" || { echo "::error::$ENV_FILE is missing on the runner host"; exit 1; }
      - name: Build images
        run: |
          export ESA_VERSION="$(git rev-parse --short HEAD)" ESA_COMMIT="$(git rev-parse HEAD)"
          docker compose -f deploy/compose.yaml --env-file "$ENV_FILE" build --pull
      - name: Start
        run: |
          export ESA_VERSION="$(git rev-parse --short HEAD)" ESA_COMMIT="$(git rev-parse HEAD)"
          docker compose -f deploy/compose.yaml --env-file "$ENV_FILE" up -d --remove-orphans --wait --wait-timeout 180
      - name: Health
        run: |
          docker compose -f deploy/compose.yaml --env-file "$ENV_FILE" ps
          docker compose -f deploy/compose.yaml --env-file "$ENV_FILE" exec -T web wget -qO- http://127.0.0.1:3000/healthz
