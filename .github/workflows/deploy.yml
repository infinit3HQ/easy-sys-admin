name: Deploy

# Called only after the exact source commit passes all checks and both images
# are published. Production and nightly use separate GitHub environments.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      sha:
        required: true
        type: string
      version:
        required: true
        type: string
      control-plane-image:
        required: true
        type: string
      web-image:
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.environment == 'production' || inputs.environment == 'nightly'
    runs-on: [self-hosted, esa-deploy]
    environment:
      name: ${{ inputs.environment }}
      url: https://${{ vars.ESA_HOST }}
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Write env file from secrets
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          ESA_CONTROL_PLANE_IMAGE: ${{ inputs.control-plane-image }}
          ESA_WEB_IMAGE: ${{ inputs.web-image }}
          ESA_VERSION: ${{ inputs.version }}
          ESA_COMMIT: ${{ inputs.sha }}
          ESA_HOST: ${{ vars.ESA_HOST }}
          ESA_SIGNUP: ${{ vars.ESA_SIGNUP || 'false' }}
          # Empty leaves the control plane default.
          ESA_ALLOW_PRIVATE_NETWORKS: ${{ vars.ESA_ALLOW_PRIVATE_NETWORKS }}
          ESA_AUTH_PASSWORD: ${{ vars.ESA_AUTH_PASSWORD || 'true' }}
          ESA_ALLOWED_EMAILS: ${{ vars.ESA_ALLOWED_EMAILS }}
          ESA_OIDC_ISSUER: ${{ vars.ESA_OIDC_ISSUER }}
          ESA_OIDC_PROVIDER_NAME: ${{ vars.ESA_OIDC_PROVIDER_NAME || 'Authentik' }}
          ESA_OIDC_CLIENT_ID: ${{ vars.ESA_OIDC_CLIENT_ID }}
          ESA_GOOGLE_CLIENT_ID: ${{ vars.ESA_GOOGLE_CLIENT_ID }}
          ESA_SMTP_HOST: ${{ vars.ESA_SMTP_HOST }}
          ESA_SMTP_PORT: ${{ vars.ESA_SMTP_PORT }}
          ESA_SMTP_USERNAME: ${{ vars.ESA_SMTP_USERNAME }}
          ESA_SMTP_FROM: ${{ vars.ESA_SMTP_FROM }}
          # Empty leaves the control plane defaults.
          ESA_POLL_CONCURRENCY: ${{ vars.ESA_POLL_CONCURRENCY }}
          ESA_MAX_SERVERS_PER_ACCOUNT: ${{ vars.ESA_MAX_SERVERS_PER_ACCOUNT }}
          ESA_BETA_LIMITS: ${{ vars.ESA_BETA_LIMITS || 'true' }}
          ESA_SEO: ${{ vars.ESA_SEO || 'false' }}
          ESA_SOURCE_URL: ${{ vars.ESA_SOURCE_URL }}
          ESA_AUDIT_RETENTION: ${{ vars.ESA_AUDIT_RETENTION }}
          ESA_AUDIT_HOLD_UNTIL: ${{ vars.ESA_AUDIT_HOLD_UNTIL }}
          ESA_REPORT_RETENTION: ${{ vars.ESA_REPORT_RETENTION }}
          ESA_METRICS_RAW_RETENTION: ${{ vars.ESA_METRICS_RAW_RETENTION }}
          ESA_METRICS_HOURLY_RETENTION: ${{ vars.ESA_METRICS_HOURLY_RETENTION }}
          ESA_STACK_NAME: ${{ vars.ESA_STACK_NAME || 'esa' }}
          ESA_ROUTER: ${{ vars.ESA_ROUTER || 'esa' }}
          TRAEFIK_NETWORK: ${{ vars.TRAEFIK_NETWORK || 'proxy' }}
          TRAEFIK_ENTRYPOINT: ${{ vars.TRAEFIK_ENTRYPOINT || 'websecure' }}
          TRAEFIK_CERT_RESOLVER: ${{ vars.TRAEFIK_CERT_RESOLVER || 'cloudflare' }}
          ESA_MASTER_KEY: ${{ secrets.ESA_MASTER_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ESA_OIDC_CLIENT_SECRET: ${{ secrets.ESA_OIDC_CLIENT_SECRET }}
          ESA_GOOGLE_CLIENT_SECRET: ${{ secrets.ESA_GOOGLE_CLIENT_SECRET }}
          ESA_SMTP_PASSWORD: ${{ secrets.ESA_SMTP_PASSWORD }}
        run: |
          set -eu
          for v in ESA_HOST ESA_MASTER_KEY POSTGRES_PASSWORD; do
            if [ -z "$(printenv "$v")" ]; then echo "::error::$v is not set (check the selected GitHub environment)"; exit 1; fi
          done
          if [ "$DEPLOY_ENVIRONMENT" = nightly ]; then
            [ "$ESA_STACK_NAME" = esa-nightly ] && [ "$ESA_ROUTER" = esa-nightly ] || { echo '::error::Nightly requires its own esa-nightly project and router'; exit 1; }
            [ "$ESA_HOST" != easysysadmin.app ] && [ -n "$ESA_ALLOWED_EMAILS" ] && [ "$ESA_SEO" = false ] || { echo '::error::Nightly needs its own host, restricted email list, and SEO off'; exit 1; }
          fi
          if [ "$DEPLOY_ENVIRONMENT" = production ]; then
            [ "$ESA_STACK_NAME" = esa ] && [ "$ESA_ROUTER" = esa ] && [ "$ESA_HOST" = easysysadmin.app ] || { echo '::error::Production requires the existing esa project, router, and hostname'; exit 1; }
          fi
          for image in "$ESA_CONTROL_PLANE_IMAGE" "$ESA_WEB_IMAGE"; do
            printf '%s' "$image" | grep -Eq '^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$' || { echo '::error::Deployments require exact GHCR image digests'; exit 1; }
          done
          vars="ESA_CONTROL_PLANE_IMAGE ESA_WEB_IMAGE ESA_VERSION ESA_COMMIT ESA_HOST ESA_SIGNUP ESA_ALLOW_PRIVATE_NETWORKS ESA_AUTH_PASSWORD ESA_ALLOWED_EMAILS ESA_OIDC_ISSUER ESA_OIDC_PROVIDER_NAME
                ESA_OIDC_CLIENT_ID ESA_GOOGLE_CLIENT_ID ESA_SMTP_HOST ESA_SMTP_PORT ESA_SMTP_USERNAME ESA_SMTP_FROM ESA_MASTER_KEY POSTGRES_PASSWORD ESA_OIDC_CLIENT_SECRET ESA_GOOGLE_CLIENT_SECRET ESA_SMTP_PASSWORD
                ESA_POLL_CONCURRENCY ESA_MAX_SERVERS_PER_ACCOUNT ESA_BETA_LIMITS ESA_SEO ESA_AUDIT_RETENTION ESA_AUDIT_HOLD_UNTIL ESA_REPORT_RETENTION ESA_METRICS_RAW_RETENTION ESA_METRICS_HOURLY_RETENTION ESA_SOURCE_URL
                ESA_STACK_NAME ESA_ROUTER TRAEFIK_NETWORK TRAEFIK_ENTRYPOINT TRAEFIK_CERT_RESOLVER"
          # Values are written in single quotes, so they cannot hold a single quote or a line break.
          nl='
          '
          for v in $vars; do
            case "$(printenv "$v")" in
              *"'"*|*"$nl"*) echo "::error::$v contains a single quote or a line break, which the env file cannot hold"; exit 1 ;;
            esac
          done
          umask 077
          f="$RUNNER_TEMP/esa-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.env"
          {
            # Single quotes: compose takes the value literally.
            for v in $vars; do
              printf "%s='%s'\n" "$v" "$(printenv "$v")"
            done
            printf "ESA_PUBLIC_URL='https://%s'\n" "$ESA_HOST"
          } > "$f"
          printf 'ENV_FILE=%s\nESA_TEMP_ENV_FILE=%s\n' "$f" "$f" >> "$GITHUB_ENV"

      - name: Pull verified images
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          export DOCKER_CONFIG="$RUNNER_TEMP/esa-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$DOCKER_CONFIG"
          printf 'DOCKER_CONFIG=%s\nESA_TEMP_DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" "$DOCKER_CONFIG" >> "$GITHUB_ENV"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          deploy/run.sh pull

      - name: Back up production before restart
        if: inputs.environment == 'production'
        env:
          ESA_DEPLOY_BACKUP_DIR: ${{ vars.ESA_DEPLOY_BACKUP_DIR }}
          ESA_BACKUP_KEEP: ${{ vars.ESA_BACKUP_KEEP }}
          ESA_BACKUP_AGE_RECIPIENT: ${{ vars.ESA_BACKUP_AGE_RECIPIENT }}
        run: deploy/backup-production.sh

      - name: Close nightly public route during bootstrap
        if: inputs.environment == 'nightly'
        run: deploy/run.sh rm --stop --force web

      - name: Start database and control plane
        run: deploy/run.sh up -d --no-build --pull never --wait --wait-timeout 180 postgres esa

      - name: Bootstrap private nightly account
        if: inputs.environment == 'nightly'
        env:
          ESA_ALLOWED_EMAILS: ${{ vars.ESA_ALLOWED_EMAILS }}
        run: deploy/bootstrap-nightly.sh

      - name: Start web
        run: deploy/run.sh up -d --no-build --pull never --wait --wait-timeout 180

      - name: Health
        run: |
          deploy/run.sh ps
          deploy/run.sh exec -T web wget -qO- http://127.0.0.1:3000/healthz

      - name: Remove temporary credentials
        if: always()
        run: |
          if [ -n "${ESA_TEMP_ENV_FILE:-}" ]; then rm -f "$ESA_TEMP_ENV_FILE"; fi
          if [ -n "${ESA_TEMP_DOCKER_CONFIG:-}" ]; then rm -rf "$ESA_TEMP_DOCKER_CONFIG"; fi
