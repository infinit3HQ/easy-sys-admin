name: Deploy

# Builds the images on the server and restarts the stack with compose.
# Runs on the self-hosted runner on Server_One, under its own user.
# Secrets come from the production environment, variables from the
# repository; the env file exists only for the length of the job.
#
# Pushes to main of this repository deploy after CI passes when the
# repository variable DEPLOY_ENABLED is "true". "Run workflow" deploys on
# demand, from main only. CI runs for pull requests and forks never deploy.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
        vars.DEPLOY_ENABLED == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, esa-deploy]
    environment:
      name: production
      url: https://${{ vars.ESA_HOST }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Write env file from secrets
        env:
          ESA_HOST: ${{ vars.ESA_HOST }}
          ESA_SIGNUP: ${{ vars.ESA_SIGNUP || 'false' }}
          # Empty leaves the control plane default.
          ESA_ALLOW_PRIVATE_NETWORKS: ${{ vars.ESA_ALLOW_PRIVATE_NETWORKS }}
          ESA_AUTH_PASSWORD: ${{ vars.ESA_AUTH_PASSWORD || 'true' }}
          ESA_ALLOWED_EMAILS: ${{ vars.ESA_ALLOWED_EMAILS }}
          ESA_OIDC_ISSUER: ${{ vars.ESA_OIDC_ISSUER }}
          ESA_OIDC_PROVIDER_NAME: ${{ vars.ESA_OIDC_PROVIDER_NAME || 'Authentik' }}
          ESA_OIDC_CLIENT_ID: ${{ vars.ESA_OIDC_CLIENT_ID }}
          ESA_GOOGLE_CLIENT_ID: ${{ vars.ESA_GOOGLE_CLIENT_ID }}
          ESA_SMTP_HOST: ${{ vars.ESA_SMTP_HOST }}
          ESA_SMTP_PORT: ${{ vars.ESA_SMTP_PORT }}
          ESA_SMTP_USERNAME: ${{ vars.ESA_SMTP_USERNAME }}
          ESA_SMTP_FROM: ${{ vars.ESA_SMTP_FROM }}
          # Empty leaves the control plane defaults.
          ESA_POLL_CONCURRENCY: ${{ vars.ESA_POLL_CONCURRENCY }}
          ESA_MAX_SERVERS_PER_ACCOUNT: ${{ vars.ESA_MAX_SERVERS_PER_ACCOUNT }}
          ESA_BETA_LIMITS: ${{ vars.ESA_BETA_LIMITS }}
          ESA_METRICS_RAW_RETENTION: ${{ vars.ESA_METRICS_RAW_RETENTION }}
          ESA_METRICS_HOURLY_RETENTION: ${{ vars.ESA_METRICS_HOURLY_RETENTION }}
          ESA_STACK_NAME: ${{ vars.ESA_STACK_NAME || 'esa' }}
          ESA_ROUTER: ${{ vars.ESA_ROUTER || 'esa' }}
          TRAEFIK_NETWORK: ${{ vars.TRAEFIK_NETWORK || 'proxy' }}
          TRAEFIK_ENTRYPOINT: ${{ vars.TRAEFIK_ENTRYPOINT || 'websecure' }}
          TRAEFIK_CERT_RESOLVER: ${{ vars.TRAEFIK_CERT_RESOLVER || 'cloudflare' }}
          ESA_MASTER_KEY: ${{ secrets.ESA_MASTER_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ESA_OIDC_CLIENT_SECRET: ${{ secrets.ESA_OIDC_CLIENT_SECRET }}
          ESA_GOOGLE_CLIENT_SECRET: ${{ secrets.ESA_GOOGLE_CLIENT_SECRET }}
          ESA_SMTP_PASSWORD: ${{ secrets.ESA_SMTP_PASSWORD }}
        run: |
          set -eu
          for v in ESA_HOST ESA_MASTER_KEY POSTGRES_PASSWORD; do
            if [ -z "$(printenv "$v")" ]; then echo "::error::$v is not set (secrets belong to the production environment, variables to the repository)"; exit 1; fi
          done
          vars="ESA_HOST ESA_SIGNUP ESA_ALLOW_PRIVATE_NETWORKS ESA_AUTH_PASSWORD ESA_ALLOWED_EMAILS ESA_OIDC_ISSUER ESA_OIDC_PROVIDER_NAME
                ESA_OIDC_CLIENT_ID ESA_GOOGLE_CLIENT_ID ESA_SMTP_HOST ESA_SMTP_PORT ESA_SMTP_USERNAME ESA_SMTP_FROM ESA_MASTER_KEY POSTGRES_PASSWORD ESA_OIDC_CLIENT_SECRET ESA_GOOGLE_CLIENT_SECRET ESA_SMTP_PASSWORD
                ESA_POLL_CONCURRENCY ESA_MAX_SERVERS_PER_ACCOUNT ESA_BETA_LIMITS ESA_METRICS_RAW_RETENTION ESA_METRICS_HOURLY_RETENTION
                ESA_STACK_NAME ESA_ROUTER TRAEFIK_NETWORK TRAEFIK_ENTRYPOINT TRAEFIK_CERT_RESOLVER"
          # Values are written in single quotes, so they cannot hold a single quote or a line break.
          nl='
          '
          for v in $vars; do
            case "$(printenv "$v")" in
              *"'"*|*"$nl"*) echo "::error::$v contains a single quote or a line break, which the env file cannot hold"; exit 1 ;;
            esac
          done
          umask 077
          f="$RUNNER_TEMP/esa-$GITHUB_RUN_ID.env"
          {
            # Single quotes: compose takes the value literally.
            for v in $vars; do
              printf "%s='%s'\n" "$v" "$(printenv "$v")"
            done
            printf "ESA_PUBLIC_URL='https://%s'\n" "$ESA_HOST"
            printf "ESA_VERSION='%s'\nESA_COMMIT='%s'\n" "$(git rev-parse --short HEAD)" "$(git rev-parse HEAD)"
          } > "$f"
          echo "ENV_FILE=$f" >> "$GITHUB_ENV"

      - name: Build images
        run: docker compose -f deploy/compose.yaml --env-file "$ENV_FILE" build --pull

      - name: Start
        run: docker compose -f deploy/compose.yaml --env-file "$ENV_FILE" up -d --remove-orphans --wait --wait-timeout 180

      - name: Health
        run: |
          docker compose -f deploy/compose.yaml --env-file "$ENV_FILE" ps
          docker compose -f deploy/compose.yaml --env-file "$ENV_FILE" exec -T web wget -qO- http://127.0.0.1:3000/healthz

      - name: Remove env file
        if: always()
        run: rm -f "$ENV_FILE"
