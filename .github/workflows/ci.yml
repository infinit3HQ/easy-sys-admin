name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (control plane, helper, CLI)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: esa
          POSTGRES_PASSWORD: esa
          POSTGRES_DB: esa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U esa" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/esa
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/esa/go.mod
          cache-dependency-path: apps/esa/go.sum
      - name: Generated code is up to date
        run: go generate ./... && git diff --exit-code -- internal/api internal/apiclient
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Test
        env:
          ESA_TEST_DATABASE_URL: postgres://esa:esa@localhost:5432/esa_test?sslmode=disable
        run: go test -race -count=1 ./...
      - name: Build control plane and helpers
        run: |
          go build -o bin/esa ./cmd/esa
          for arch in amd64 arm64; do GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -o bin/esa-helper-linux-$arch ./cmd/esa-helper; done

  web:
    name: Web and API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install -g pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      - name: Generated types are up to date
        run: pnpm --filter @esa/api generate && git diff --exit-code -- packages/api/src/schema.gen.ts
      - name: Docs API reference is up to date
        run: pnpm --filter @esa/web generate:docs && git diff --exit-code -- apps/web/src/content/docs/api.md
      - run: pnpm turbo run lint typecheck build --filter=!@esa/esa

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/esa/go.mod
          cache-dependency-path: apps/esa/go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install -g pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      - name: Third-party notices
        run: node scripts/third-party-notices.mjs && git diff --exit-code -- THIRD_PARTY_NOTICES.md
