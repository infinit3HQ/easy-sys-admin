openapi: 3.0.3
info:
  title: easy-sys-admin control plane API
  version: 0.1.0
  description: |
    JSON API of the control plane (`esa serve`). The web app, the CLI, and the
    MCP server all read and write through this API.

    Browser sessions authenticate with the session cookie set by `/auth/callback`.
    In production the cookie is named `__Host-esa_session`; on plain-HTTP local
    development it is `esa_session`.
  license:
    name: Proprietary
servers:
  - url: /api/v1

security:
  - sessionCookie: []

paths:
  /auth/config:
    get:
      operationId: getAuthConfig
      summary: How users sign in to this install
      tags: [auth]
      security: []
      responses:
        '200':
          description: Sign-in configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'

  /me:
    get:
      operationId: getMe
      summary: The signed-in user and their current account
      tags: [session]
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/account:
    put:
      operationId: switchAccount
      summary: Change the account this session works in
      tags: [session]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchAccountRequest'
      responses:
        '200':
          description: Session after the switch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /fleet/overview:
    get:
      operationId: getFleetOverview
      summary: Every server in the current account with its latest status
      tags: [fleet]
      responses:
        '200':
          description: Fleet overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: esa_session

  responses:
    BadRequest:
      description: The request is malformed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No valid session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The session may not do this
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code.
          example: unauthorized
        message:
          type: string
          description: Human-readable explanation.
          example: Sign in to continue.

    AuthConfig:
      type: object
      required: [mode, providerName]
      properties:
        mode:
          type: string
          enum: [oidc, dev]
          description: '`dev` is a local-only login that needs no identity provider.'
        providerName:
          type: string
          example: Authentik

    Role:
      type: string
      enum: [owner, admin, viewer]

    User:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string

    AccountMembership:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    Me:
      type: object
      required: [user, account, accounts]
      properties:
        user:
          $ref: '#/components/schemas/User'
        account:
          $ref: '#/components/schemas/AccountMembership'
        accounts:
          type: array
          description: Every account the user belongs to, including the current one.
          items:
            $ref: '#/components/schemas/AccountMembership'

    SwitchAccountRequest:
      type: object
      required: [accountId]
      properties:
        accountId:
          type: integer
          format: int64

    ServerStatus:
      type: string
      description: |
        `pending` means the server was added but never answered a poll yet.
      enum: [ok, warning, failing, unreachable, pending]

    ServerSummary:
      type: object
      required: [id, name, host, status]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        host:
          type: string
        groupName:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ServerStatus'
        lastSeenAt:
          type: string
          format: date-time
          nullable: true

    FleetTotals:
      type: object
      required: [servers, groups, ok, warning, failing, unreachable]
      properties:
        servers:
          type: integer
        groups:
          type: integer
        ok:
          type: integer
        warning:
          type: integer
        failing:
          type: integer
        unreachable:
          type: integer

    FleetOverview:
      type: object
      required: [totals, servers]
      properties:
        totals:
          $ref: '#/components/schemas/FleetTotals'
        servers:
          type: array
          items:
            $ref: '#/components/schemas/ServerSummary'
