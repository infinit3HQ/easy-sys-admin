openapi: 3.0.3
info:
  title: easy-sys-admin control plane API
  version: 1.0.0
  description: |
    JSON API of the control plane (`esa serve`). The web app, the `esa` CLI,
    and the MCP server all go through it.

    Browsers authenticate with the session cookie set by `/auth/callback`.
    The CLI and MCP clients send `Authorization: Bearer esa_...` with a token
    from Settings > API tokens. A token can do at most what its user's role
    allows, limited further by its scopes (`read`, `logs:read`, `actions`,
    `admin`).

    Every error has the shape `{"error": {"code": "...", "message": "..."}}`.
    Codes: `bad_request` (400), `unauthorized` (401), `forbidden` (403),
    `not_found` (404), `conflict` (409), `unavailable` (502).
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /api/v1

security:
  - sessionCookie: []
  - bearerToken: []

tags:
  - name: session
  - name: fleet
  - name: servers
  - name: server-live
    description: Live data read from a server through esa-helper.
  - name: groups
  - name: runs
  - name: alerts
  - name: settings
  - name: organizations
    description: |
      Every user has one personal space, private to them. An organization
      is a space with several members, each an owner, admin, or viewer.
      Inside an organization, teams give their members admin rights on
      chosen server groups. The API calls a space an account; the current
      account is the one the session works in (see switchAccount).
  - name: sharing
    description: |
      An organization can share a group, and the servers in it, with
      another organization. The owner keeps the SSH key, the group's
      settings and schedules, and alerts. "view" lets the other organization
      see the servers; "operate" also lets its admins start runs, act on
      services and containers, and read logs. Runs they start are recorded
      in the owning organization.

paths:
  /auth/config:
    get:
      operationId: getAuthConfig
      summary: How users sign in to this install
      tags: [session]
      security: []
      responses:
        '200':
          description: Sign-in configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthConfig' }
        default: { $ref: '#/components/responses/Error' }

  /me:
    get:
      operationId: getMe
      summary: The signed-in user and their current account
      tags: [session]
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Error' }

  /me/account:
    put:
      operationId: switchAccount
      summary: Change the account this browser session works in
      tags: [session]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwitchAccountRequest' }
      responses:
        '200':
          description: Session after the switch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Error' }

  /orgs:
    post:
      operationId: createOrganization
      summary: Create an organization; the caller becomes its owner (browser sessions only)
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationInput' }
      responses:
        '201':
          description: The caller's membership in the new organization. Switch to it with switchAccount.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountMembership' }
        default: { $ref: '#/components/responses/Error' }

  /org:
    get:
      operationId: getOrganization
      summary: The current account
      tags: [organizations]
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateOrganization
      summary: Rename the current account or its two built-in teams (owners and admins)
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOrganizationRequest' }
      responses:
        '200':
          description: The organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteOrganization
      summary: Delete the current organization with its servers, groups and history (owners only; not the personal space)
      tags: [organizations]
      parameters:
        - name: confirm
          in: query
          required: true
          description: The organization's exact name.
          schema: { type: string }
      responses:
        '204':
          description: Deleted. Sessions working in it move to the caller's personal space.
        default: { $ref: '#/components/responses/Error' }

  /org/members:
    get:
      operationId: listMembers
      summary: Members of the current account
      tags: [organizations]
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberList' }
        default: { $ref: '#/components/responses/Error' }

  /org/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: updateMember
      summary: Change a member's role. Owners and admins move people between admin and viewer; only owners grant or take away owner. An organization always keeps at least one owner.
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMemberRequest' }
      responses:
        '200':
          description: The member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeMember
      summary: Remove a member (owners and admins; only owners remove owners), or leave the organization (your own user id). The last owner cannot leave.
      tags: [organizations]
      responses:
        '204':
          description: Removed
        default: { $ref: '#/components/responses/Error' }

  /org/teams:
    get:
      operationId: listTeams
      summary: Teams of the current organization. The two built-in teams (admins and viewers) are the organization roles and are not listed here.
      tags: [organizations]
      responses:
        '200':
          description: Teams
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createTeam
      summary: Create a team that gives its members admin rights on chosen server groups (owners and admins)
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
      responses:
        '201':
          description: The new team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        default: { $ref: '#/components/responses/Error' }

  /org/teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    put:
      operationId: updateTeam
      summary: Rename a team and replace its server groups (owners and admins)
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
      responses:
        '200':
          description: The team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteTeam
      summary: Delete a team. Its members keep their organization role (owners and admins)
      tags: [organizations]
      responses:
        '204':
          description: Deleted
        default: { $ref: '#/components/responses/Error' }

  /org/teams/{teamId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: addTeamMember
      summary: Add a member of the organization to a team (owners and admins)
      tags: [organizations]
      responses:
        '200':
          description: The team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeTeamMember
      summary: Take a member out of a team (owners and admins)
      tags: [organizations]
      responses:
        '204':
          description: Removed
        default: { $ref: '#/components/responses/Error' }

  /org/invites:
    get:
      operationId: listInvites
      summary: Pending invites of the current organization (owners and admins)
      tags: [organizations]
      responses:
        '200':
          description: Invites
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createInvite
      summary: Create a one-time invite link (owners and admins; only owners invite owners). The link is shown once.
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInviteRequest' }
      responses:
        '201':
          description: The invite and its link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedInvite' }
        default: { $ref: '#/components/responses/Error' }

  /org/invites/{inviteId}:
    parameters:
      - name: inviteId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: revokeInvite
      summary: Revoke a pending invite
      tags: [organizations]
      responses:
        '204':
          description: Revoked
        default: { $ref: '#/components/responses/Error' }

  /invites/{token}:
    parameters:
      - $ref: '#/components/parameters/LinkToken'
    get:
      operationId: getInvite
      summary: What an invite link offers, for the signed-in user
      tags: [organizations]
      responses:
        '200':
          description: Invite preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitePreview' }
        default: { $ref: '#/components/responses/Error' }

  /invites/{token}/accept:
    parameters:
      - $ref: '#/components/parameters/LinkToken'
    post:
      operationId: acceptInvite
      summary: Join the organization and switch this session to it (browser sessions only)
      tags: [organizations]
      responses:
        '200':
          description: The new membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountMembership' }
        default: { $ref: '#/components/responses/Error' }

  /fleet/overview:
    get:
      operationId: getFleetOverview
      summary: Every server in the current account with its latest status, worst first
      tags: [fleet]
      responses:
        '200':
          description: Fleet overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetOverview' }
        default: { $ref: '#/components/responses/Error' }

  /servers/probe:
    post:
      operationId: probeServer
      summary: Read a server's SSH host key without logging in
      description: Show the fingerprint to the person adding the server so they can compare it before any credential is sent.
      tags: [servers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProbeRequest' }
      responses:
        '200':
          description: The presented host key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProbeResult' }
        default: { $ref: '#/components/responses/Error' }

  /servers:
    post:
      operationId: addServer
      summary: Add a server with a one-time sudo login (installs esa-helper)
      tags: [servers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddServerRequest' }
      responses:
        '201':
          description: The new server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Server' }
        default: { $ref: '#/components/responses/Error' }

  /servers/enrollments:
    post:
      operationId: createEnrollment
      summary: Register a server and get a one-time enroll command to paste on it
      tags: [servers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollRequest' }
      responses:
        '201':
          description: The pending server and its enroll command
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        default: { $ref: '#/components/responses/Error' }

  /servers/{serverId}:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    get:
      operationId: getServer
      summary: One server with its latest snapshot and pending updates
      tags: [servers]
      responses:
        '200':
          description: Server detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerDetail' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateServer
      summary: Rename a server, move it to another group, or change its protection settings
      tags: [servers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateServerRequest' }
      responses:
        '200':
          description: The updated server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Server' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteServer
      summary: Remove a server from esa
      tags: [servers]
      parameters:
        - name: uninstall
          in: query
          description: Also remove the esa user, its sudo rule, and esa-helper from the server.
          schema: { type: boolean, default: false }
      responses:
        '204':
          description: Removed
        default: { $ref: '#/components/responses/Error' }

  /servers/{serverId}/enrollment:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    post:
      operationId: renewEnrollment
      summary: Issue a new enroll command for a pending server
      tags: [servers]
      responses:
        '200':
          description: A fresh enroll command
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        default: { $ref: '#/components/responses/Error' }

  /servers/{serverId}/host-key:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    post:
      operationId: acceptHostKey
      summary: Accept the new host key a server presented
      tags: [servers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptHostKeyRequest' }
      responses:
        '200':
          description: The server, working again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Server' }
        default: { $ref: '#/components/responses/Error' }

  /servers/{serverId}/helper:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    post:
      operationId: reinstallHelper
      summary: Reinstall or update esa-helper with a sudo login (or the stored one)
      tags: [servers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReinstallRequest' }
      responses:
        '200':
          description: The server with the new helper version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Server' }
        default: { $ref: '#/components/responses/Error' }

  /servers/{serverId}/metrics:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    get:
      operationId: getServerMetrics
      summary: Chart points for CPU, memory, disk, and load
      tags: [servers]
      parameters:
        - name: window
          in: query
          schema: { type: string, enum: [1h, 24h, 7d, 30d, 90d], default: 24h }
      responses:
        '200':
          description: Points, oldest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsResponse' }
        default: { $ref: '#/components/responses/Error' }

  /servers/{serverId}/updates/check:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    post:
      operationId: checkServerUpdates
      summary: Refresh package lists on the server (apt-get update) and list pending updates
      tags: [server-live]
      responses:
        '200':
          description: The server with fresh update data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerDetail' }
        default: { $ref: '#/components/responses/Error' }

  /servers/{serverId}/services:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    get:
      operationId: listServices
      summary: systemd services on the server, failed first
      tags: [server-live]
      responses:
        '200':
          description: Services
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceList' }
        default: { $ref: '#/components/responses/Error' }

  /servers/{serverId}/services/{unit}/{action}:
    parameters:
      - $ref: '#/components/parameters/ServerId'
      - name: unit
        in: path
        required: true
        schema: { type: string, example: nginx.service }
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [start, stop, restart] }
    post:
      operationId: serviceAction
      summary: Start, stop, or restart a service. Protected units cannot be stopped.
      tags: [server-live]
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
        default: { $ref: '#/components/responses/Error' }

  /servers/{serverId}/containers:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    get:
      operationId: listContainers
      summary: Docker containers on the server
      tags: [server-live]
      responses:
        '200':
          description: Containers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContainerList' }
        default: { $ref: '#/components/responses/Error' }

  /servers/{serverId}/containers/image-check:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    get:
      operationId: checkContainerImages
      summary: Compare each container's image with its registry
      tags: [server-live]
      responses:
        '200':
          description: One result per container
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageCheckList' }
        default: { $ref: '#/components/responses/Error' }

  /servers/{serverId}/containers/{name}/{action}:
    parameters:
      - $ref: '#/components/parameters/ServerId'
      - name: name
        in: path
        required: true
        schema: { type: string }
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [start, stop, restart, update] }
    post:
      operationId: containerAction
      summary: Start, stop, restart, or update (pull and recreate) one container
      description: Protected containers need `confirm` set to the container's name.
      tags: [server-live]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContainerActionRequest' }
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
        default: { $ref: '#/components/responses/Error' }

  /servers/{serverId}/logs:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    get:
      operationId: getServerLogs
      summary: Journal lines of a unit, or log lines of a container (needs logs:read)
      tags: [server-live]
      parameters:
        - { name: unit, in: query, schema: { type: string } }
        - { name: container, in: query, schema: { type: string } }
        - { name: lines, in: query, schema: { type: integer, default: 200, minimum: 1, maximum: 1000 } }
        - { name: priority, in: query, description: 'Journal priority 0 (emerg) to 7 (debug); -1 for all', schema: { type: integer, default: -1, minimum: -1, maximum: 7 } }
        - { name: grep, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        '200':
          description: Log lines, oldest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogList' }
        default: { $ref: '#/components/responses/Error' }

  /servers/{serverId}/access:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    get:
      operationId: getServerAccess
      summary: Login users, password state, sudo rules, SSH settings, recent logins
      tags: [server-live]
      responses:
        '200':
          description: Access report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessReport' }
        default: { $ref: '#/components/responses/Error' }

  /servers/{serverId}/security:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    get:
      operationId: getServerSecurity
      summary: Listening ports, firewall rules, CrowdSec and fail2ban, unattended-upgrades
      tags: [server-live]
      responses:
        '200':
          description: Security report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityReport' }
        default: { $ref: '#/components/responses/Error' }

  /servers/{serverId}/jobs:
    parameters:
      - $ref: '#/components/parameters/ServerId'
    get:
      operationId: getServerJobs
      summary: Cron entries and systemd timers
      tags: [server-live]
      responses:
        '200':
          description: Scheduled jobs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobsReport' }
        default: { $ref: '#/components/responses/Error' }

  /groups:
    get:
      operationId: listGroups
      summary: Groups in the current account
      tags: [groups]
      responses:
        '200':
          description: Groups
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createGroup
      summary: Create a group
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupInput' }
      responses:
        '201':
          description: The new group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        default: { $ref: '#/components/responses/Error' }

  /groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      operationId: getGroup
      summary: One group with its last runs
      tags: [groups]
      responses:
        '200':
          description: Group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: updateGroup
      summary: Replace a group's settings
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupInput' }
      responses:
        '200':
          description: The updated group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteGroup
      summary: Delete a group; its servers stay, without a group
      tags: [groups]
      responses:
        '204':
          description: Deleted
        default: { $ref: '#/components/responses/Error' }

  /groups/{groupId}/shares:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      operationId: listGroupShares
      summary: Teams this group is shared with (admins of the owning team)
      tags: [sharing]
      responses:
        '200':
          description: Shares
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupShareList' }
        default: { $ref: '#/components/responses/Error' }

  /groups/{groupId}/share-links:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      operationId: listShareLinks
      summary: Pending share links of a group (admins of the owning team)
      tags: [sharing]
      responses:
        '200':
          description: Share links
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareLinkList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createShareLink
      summary: Create a one-time link that shares the group with another team. The link is shown once.
      tags: [sharing]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateShareLinkRequest' }
      responses:
        '201':
          description: The link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedShareLink' }
        default: { $ref: '#/components/responses/Error' }

  /share-links/{linkId}:
    parameters:
      - name: linkId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: revokeShareLink
      summary: Revoke a pending share link
      tags: [sharing]
      responses:
        '204':
          description: Revoked
        default: { $ref: '#/components/responses/Error' }

  /group-shares/{shareId}:
    parameters:
      - name: shareId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updateGroupShare
      summary: Change a share's access (admins of the owning team)
      tags: [sharing]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGroupShareRequest' }
      responses:
        '200':
          description: The share
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupShare' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeGroupShare
      summary: Stop sharing (admins of the owning team), or remove a group shared with you (admins of the receiving team)
      tags: [sharing]
      responses:
        '204':
          description: Removed
        default: { $ref: '#/components/responses/Error' }

  /shares/{token}:
    parameters:
      - $ref: '#/components/parameters/LinkToken'
    get:
      operationId: getShareLink
      summary: What a share link offers, and which of the caller's teams can accept it
      tags: [sharing]
      responses:
        '200':
          description: Share preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharePreview' }
        default: { $ref: '#/components/responses/Error' }

  /shares/{token}/accept:
    parameters:
      - $ref: '#/components/parameters/LinkToken'
    post:
      operationId: acceptShareLink
      summary: Add the shared group to one of your teams (you must be an owner or admin there; browser sessions only)
      tags: [sharing]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptShareRequest' }
      responses:
        '200':
          description: The new share
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupShare' }
        default: { $ref: '#/components/responses/Error' }

  /runs:
    get:
      operationId: listRuns
      summary: Maintenance runs, newest first
      tags: [runs]
      parameters:
        - { name: groupId, in: query, schema: { type: integer, format: int64 } }
        - { name: serverId, in: query, schema: { type: integer, format: int64 } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/RunKind' } }
        - { name: status, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: startRun
      summary: Start a measure, clean, update, or reboot run on a group or on servers
      tags: [runs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartRunRequest' }
      responses:
        '202':
          description: The run, started in the background
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        default: { $ref: '#/components/responses/Error' }

  /runs/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getRun
      summary: One run with each server's result
      tags: [runs]
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        default: { $ref: '#/components/responses/Error' }

  /keys:
    get:
      operationId: listKeys
      summary: SSH key fingerprints seen in standard authorized_keys files
      tags: [fleet]
      responses:
        '200':
          description: Keys the actor can see. This is not every key on the server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyList' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: labelKey
      summary: Name a fingerprint in this space, or clear the name
      tags: [fleet]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeyLabelRequest' }
      responses:
        '204':
          description: Saved
        default: { $ref: '#/components/responses/Error' }

  /servers/{serverId}/key-baseline:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: approveKeyBaseline
      summary: Approve the keys currently recorded on this server
      tags: [fleet]
      responses:
        '204':
          description: Saved. Later scans report drift. This does not change the server.
        default: { $ref: '#/components/responses/Error' }

  /offboarding:
    get:
      operationId: offboarding
      summary: Keys with this name from the files a current helper has read
      tags: [fleet]
      parameters:
        - { name: label, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Matches, plus what this check does not cover
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Offboarding' }
        default: { $ref: '#/components/responses/Error' }

  /maintenance:
    get:
      operationId: listMaintenance
      summary: Windows that quiet ordinary notifications
      tags: [alerts]
      responses:
        '200':
          description: Windows that have not ended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createMaintenance
      summary: Quiet ordinary notifications for at most 7 days
      tags: [alerts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceRequest' }
      responses:
        '201':
          description: The window
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceWindow' }
        default: { $ref: '#/components/responses/Error' }

  /maintenance/{windowId}:
    parameters:
      - { name: windowId, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      operationId: deleteMaintenance
      summary: Remove a maintenance window
      tags: [alerts]
      responses:
        '204':
          description: Removed
        default: { $ref: '#/components/responses/Error' }

  /incidents:
    get:
      operationId: listIncidents
      summary: Security notices that still need a person to look at them
      tags: [alerts]
      parameters:
        - { name: includeAcknowledged, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Incidents
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentList' }
        default: { $ref: '#/components/responses/Error' }

  /incidents/{incidentId}/snooze:
    parameters:
      - { name: incidentId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: snoozeIncident
      summary: Hide a notice until a time within 7 days. A host key change cannot be snoozed.
      tags: [alerts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [until, reason]
              properties:
                until: { type: string, format: date-time }
                reason: { type: string, maxLength: 200 }
      responses:
        '200':
          description: The incident
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        default: { $ref: '#/components/responses/Error' }

  /incidents/{incidentId}/acknowledge:
    parameters:
      - { name: incidentId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: acknowledgeIncident
      summary: Record that a person has reviewed this notice. This does not change the server.
      tags: [alerts]
      responses:
        '200':
          description: The incident
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        default: { $ref: '#/components/responses/Error' }

  /alerts:
    get:
      operationId: listAlerts
      summary: Open alerts, or recent alerts including resolved ones
      tags: [alerts]
      parameters:
        - { name: all, in: query, schema: { type: boolean, default: false } }
        - { name: limit, in: query, schema: { type: integer, default: 100, minimum: 1, maximum: 500 } }
      responses:
        '200':
          description: Alerts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertList' }
        default: { $ref: '#/components/responses/Error' }

  /alerts/rules:
    get:
      operationId: listAlertRules
      summary: Alert rules of the account
      tags: [alerts]
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertRuleList' }
        default: { $ref: '#/components/responses/Error' }

  /alerts/rules/{kind}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateAlertRule
      summary: Change one alert rule
      tags: [alerts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertRuleInput' }
      responses:
        '200':
          description: The updated rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertRule' }
        default: { $ref: '#/components/responses/Error' }

  /channels:
    get:
      operationId: listChannels
      summary: Notification channels (secrets are never returned)
      tags: [alerts]
      responses:
        '200':
          description: Channels
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createChannel
      summary: Add a notification channel (owner only)
      tags: [alerts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateChannelRequest' }
      responses:
        '201':
          description: The new channel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
        default: { $ref: '#/components/responses/Error' }

  /channels/{channelId}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    patch:
      operationId: updateChannel
      summary: Turn a channel on or off
      tags: [alerts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateChannelRequest' }
      responses:
        '204':
          description: Updated
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteChannel
      summary: Delete a channel
      tags: [alerts]
      responses:
        '204':
          description: Deleted
        default: { $ref: '#/components/responses/Error' }

  /channels/{channelId}/test:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      operationId: testChannel
      summary: Send a test notification
      tags: [alerts]
      responses:
        '200':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
        default: { $ref: '#/components/responses/Error' }

  /certs:
    get:
      operationId: listCerts
      summary: TLS certificates checked daily, soonest expiry first
      tags: [alerts]
      responses:
        '200':
          description: Certificates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: addCert
      summary: Add a hostname to check
      tags: [alerts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCertRequest' }
      responses:
        '201':
          description: The checked certificate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cert' }
        default: { $ref: '#/components/responses/Error' }

  /certs/{certId}:
    parameters:
      - name: certId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: deleteCert
      summary: Stop checking a hostname
      tags: [alerts]
      responses:
        '204':
          description: Deleted
        default: { $ref: '#/components/responses/Error' }

  /tokens:
    get:
      operationId: listTokens
      summary: Your API tokens in this account (browser sessions only)
      tags: [settings]
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createToken
      summary: Create an API token for the CLI or an MCP client. The secret is shown once.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTokenRequest' }
      responses:
        '201':
          description: The token and its secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedToken' }
        default: { $ref: '#/components/responses/Error' }

  /tokens/{tokenId}:
    parameters:
      - name: tokenId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: revokeToken
      summary: Revoke a token
      tags: [settings]
      responses:
        '204':
          description: Revoked
        default: { $ref: '#/components/responses/Error' }

  /activity:
    get:
      operationId: listActivity
      summary: Audit log of the account, newest first (admins)
      tags: [settings]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100, minimum: 1, maximum: 500 } }
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityList' }
        default: { $ref: '#/components/responses/Error' }

  /settings/ssh-key:
    get:
      operationId: getSSHKey
      summary: The public key the control plane logs in to servers with
      tags: [settings]
      responses:
        '200':
          description: Public key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SSHKey' }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: esa_session
    bearerToken:
      type: http
      scheme: bearer
      description: An API token (esa_...) from Settings > API tokens.

  parameters:
    ServerId:
      name: serverId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ChannelId:
      name: channelId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    LinkToken:
      name: token
      in: path
      required: true
      description: The secret part of an invite or share link.
      schema: { type: string, maxLength: 128 }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorDetail' }

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: Stable machine-readable code., example: not_found }
        message: { type: string, description: Human-readable explanation. }
        field: { type: string, description: The input field a bad_request is about. }

    AuthConfig:
      type: object
      required: [dev, password, signup, mail, providers]
      properties:
        dev: { type: boolean, description: 'Local-only dev login without an identity provider.' }
        password: { type: boolean, description: Email and password sign-in is on. }
        signup: { type: boolean, description: New people can create an email and password account. }
        mail: { type: boolean, description: The install sends confirmation and password-reset email. }
        providers:
          type: array
          description: 'OpenID Connect providers. Start sign-in at /auth/login/{id}.'
          items: { $ref: '#/components/schemas/AuthProvider' }

    AuthProvider:
      type: object
      required: [id, name]
      properties:
        id: { type: string, example: google }
        name: { type: string, example: Google }

    Role:
      type: string
      enum: [owner, admin, viewer]

    Scope:
      type: string
      enum: [read, 'logs:read', actions, admin]

    User:
      type: object
      required: [id, email, name]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        name: { type: string }

    AccountMembership:
      type: object
      required: [id, name, role, personal]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        personal: { type: boolean, description: "The user's own private space. It has no other members." }

    AccountLimits:
      type: object
      description: Caps for the signed-in user. The hosted beta sets these lower; a self-hosted install keeps the defaults.
      required: [maxServers, maxOrganizations]
      properties:
        maxServers:
          type: integer
          description: Servers one account (a personal space or an organization) can add.
        maxOrganizations:
          type: integer
          description: Organizations one person can own, not counting their personal space.

    Me:
      type: object
      required: [user, account, accounts, viaToken, limits]
      properties:
        user: { $ref: '#/components/schemas/User' }
        account: { $ref: '#/components/schemas/AccountMembership' }
        accounts:
          type: array
          items: { $ref: '#/components/schemas/AccountMembership' }
        viaToken: { type: boolean, description: True when the request used an API token. }
        limits: { $ref: '#/components/schemas/AccountLimits' }
        scopes:
          type: array
          description: The token's scopes; absent for browser sessions.
          items: { $ref: '#/components/schemas/Scope' }

    SwitchAccountRequest:
      type: object
      required: [accountId]
      properties:
        accountId: { type: integer, format: int64 }

    OrganizationInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }

    UpdateOrganizationRequest:
      type: object
      description: Fields left out stay as they are.
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: Owners only. }
        adminTeamName: { type: string, minLength: 1, maxLength: 100, description: Display name of the built-in team of admins. }
        viewerTeamName: { type: string, minLength: 1, maxLength: 100, description: Display name of the built-in team of viewers. }

    Organization:
      type: object
      required: [id, name, personal, role, memberCount, adminTeamName, viewerTeamName, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        personal: { type: boolean }
        role: { $ref: '#/components/schemas/Role', description: "The caller's role." }
        memberCount: { type: integer }
        adminTeamName: { type: string, description: Display name of the built-in team holding everyone with the admin role. }
        viewerTeamName: { type: string, description: Display name of the built-in team holding everyone with the viewer role. }
        createdAt: { type: string, format: date-time }

    TeamInput:
      type: object
      required: [name, groupIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        groupIds:
          type: array
          description: Server groups the team's members are admins of. Groups of this organization, or groups another organization shares with it.
          items: { type: integer, format: int64 }

    TeamMember:
      type: object
      required: [userId, name, email]
      properties:
        userId: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string }

    Team:
      type: object
      required: [id, name, groups, members, createdAt]
      description: A team gives its members admin rights on its server groups, on top of their organization role.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        groups:
          type: array
          items: { $ref: '#/components/schemas/TeamGroup' }
        members:
          type: array
          items: { $ref: '#/components/schemas/TeamMember' }
        createdAt: { type: string, format: date-time }

    TeamGroup:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        ownerTeam: { type: string, nullable: true, description: Set when another organization shares the group. }

    TeamList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Team' } }

    Member:
      type: object
      required: [userId, name, email, role, joinedAt, you, teamIds]
      properties:
        teamIds:
          type: array
          description: Teams (from listTeams) the member is in.
          items: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        joinedAt: { type: string, format: date-time }
        you: { type: boolean }

    MemberList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Member' } }

    UpdateMemberRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/Role' }

    Invite:
      type: object
      required: [id, role, email, createdAt, expiresAt, createdBy]
      properties:
        id: { type: integer, format: int64 }
        role: { $ref: '#/components/schemas/Role' }
        email: { type: string, description: Only this address can accept. Empty means anyone with the link. }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        createdBy: { type: string, description: Name or email of the member who created it. }

    InviteList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Invite' } }

    CreateInviteRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        email: { type: string, maxLength: 200, description: Optional. Only this address can accept. }

    CreatedInvite:
      type: object
      required: [invite, url]
      properties:
        invite: { $ref: '#/components/schemas/Invite' }
        url: { type: string, description: 'The one-time link, {ESA_PUBLIC_URL}/invite/{token}. Shown once.' }

    InvitePreview:
      type: object
      required: [teamName, role, invitedBy, expiresAt, alreadyMember]
      properties:
        teamName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        invitedBy: { type: string }
        expiresAt: { type: string, format: date-time }
        alreadyMember: { type: boolean }

    EffectiveRole:
      type: string
      description: |
        What the caller may do with this group or server: their organization
        role, raised to admin by a team that holds the group, and limited by
        the share when another organization owns it. admin can start runs,
        act on services and containers, read logs, and (for own groups) edit
        the group's settings. owner is only reported for the caller's own
        organization when they are an owner.
      enum: [owner, admin, viewer]

    GroupAccess:
      type: string
      description: "own: the group belongs to the current account. view or operate: another team shares it."
      enum: [own, operate, view]

    ShareAccess:
      type: string
      enum: [operate, view]

    GroupShare:
      type: object
      required: [id, groupId, groupName, ownerTeam, team, access, createdAt]
      properties:
        id: { type: integer, format: int64 }
        groupId: { type: integer, format: int64 }
        groupName: { type: string }
        ownerTeam: { type: string, description: Name of the team that owns the group. }
        team: { type: string, description: Name of the team it is shared with. }
        access: { $ref: '#/components/schemas/ShareAccess' }
        createdAt: { type: string, format: date-time }

