      required: [cpuPercent, memPercent, diskPercent, load1, uptimeSeconds, rebootRequired, failedUnits, containersRunning, containersUnhealthy, os, kernel]
      properties:
        cpuPercent: { type: number, format: double }
        memPercent: { type: number, format: double }
        diskPercent: { type: number, format: double, description: Use of the fullest real filesystem. }
        load1: { type: number, format: double }
        uptimeSeconds: { type: integer, format: int64 }
        rebootRequired: { type: boolean }
        failedUnits: { type: integer }
        containersRunning: { type: integer }
        containersUnhealthy: { type: integer }
        os: { type: string }
        kernel: { type: string }

    UpdateCounts:
      type: object
      required: [security, other]
      properties:
        security: { type: integer }
        other: { type: integer }
        checkedAt: { type: string, format: date-time, nullable: true }

    Exposure:
      type: object
      required: [checkedAt, attemptedAt, ready, publicPorts, listeningOnAllInterfaces, specificBinds, passwordAuth, permitRootLogin, permitEmptyPasswords, pubkeyAuth, sshRead, firewall, extraRoot, noPasswordAll, uncovered, gaps]
      properties:
        checkedAt: { type: string, format: date-time, description: When this summary was last collected successfully. }
        attemptedAt: { type: string, format: date-time, description: When the control plane last tried to collect it. A failed try updates this and leaves checkedAt unchanged. }
        ready: { type: boolean, description: False when the helper is too old. Reinstall it. Do not treat the other fields as a clean result. }
        publicPorts:
          type: array
          items: { type: string }
          description: Deprecated alias of listeningOnAllInterfaces. Same list. Not proof the internet can connect.
        listeningOnAllInterfaces:
          type: array
          items: { type: string }
          description: 'Sockets bound to every interface, as port/proto, for example 22/tcp. Reachability is not verified.'
        specificBinds:
          type: array
          items: { type: string }
          description: 'Sockets on one non-loopback address, as "address port/proto". Not proof the internet can connect, and not proof it cannot.'
        passwordAuth: { type: boolean }
        permitRootLogin: { type: string }
        permitEmptyPasswords: { type: boolean }
        pubkeyAuth: { type: boolean }
        sshRead: { type: boolean, description: True when sshd -T was read. pubkeyAuth is meaningful only then. }
        firewall: { type: string }
        extraRoot: { type: integer, description: Login accounts other than root with uid 0. }
        noPasswordAll: { type: integer, description: Sudo rules that grant NOPASSWD and ALL. }
        uncovered: { type: integer, description: Sockets on every interface that an active ufw does not mention. }
        gaps:
          type: array
          items: { type: string }
          description: Checks that did not run for this summary. Do not treat a missing list as a clean result.

