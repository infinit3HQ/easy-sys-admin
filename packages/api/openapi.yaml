          items: { type: string }
        hasStoredLogin: { type: boolean }
        note: { type: string, maxLength: 200, description: A short note kept in the control plane. It is not sent to the server. }
        createdAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/ServerStatus' }
        reasons: { type: array, items: { type: string } }
