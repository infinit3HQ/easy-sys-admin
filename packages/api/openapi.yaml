      properties:
        type: { type: string }
        fingerprint: { type: string }
        comment: { type: string }
        from: { type: string, description: The from= restriction. Empty when the key has none. }
        hasCommand: { type: boolean, description: True when the key forces a command. The command text is not returned. }

    LoginRecord:
      x-go-type: proto.Login
      x-go-type-import: { path: github.com/nirajdilshan/easy-sys-admin/apps/esa/internal/hostops/proto }
      type: object
      required: [user, from, at]
      properties:
        user: { type: string }
        from: { type: string }
        at: { type: string, format: date-time }

    SecurityReport:
      x-go-type: proto.SecurityReport
      x-go-type-import: { path: github.com/nirajdilshan/easy-sys-admin/apps/esa/internal/hostops/proto }
      type: object
      required: [revision, listening, firewall, firewallRules, crowdsec, crowdSecBans, fail2ban, fail2banJails, unattendedUpgrades, gaps]
      properties:
        revision: { type: integer, description: 1 when the helper collected the fields below. 0 means reinstall the helper. }
        listening: { type: array, items: { $ref: '#/components/schemas/Listener' } }
        firewall: { type: string }
        firewallRules:
          type: array
          description: Up to 40 lines from an active ufw. Empty for nftables, which is named only.
          items: { type: string }
        crowdsec: { type: string }
        crowdSecBans: { type: integer, description: Current CrowdSec decisions. Addresses are not included. }
        fail2ban: { type: string }
        fail2banJails: { type: array, items: { $ref: '#/components/schemas/BanJail' } }
        unattendedUpgrades: { type: boolean }
        gaps:
          type: array
          items: { type: string }
          description: Checks that did not run. An empty listener list is not clean when listening sockets is listed.

    BanJail:
      x-go-type: proto.BanJail
      x-go-type-import: { path: github.com/nirajdilshan/easy-sys-admin/apps/esa/internal/hostops/proto }
      type: object
      required: [name, banned]
      properties:
        name: { type: string }
        banned: { type: integer, description: Addresses currently banned. The addresses are not included. }

    Listener:
      x-go-type: proto.Listener
      x-go-type-import: { path: github.com/nirajdilshan/easy-sys-admin/apps/esa/internal/hostops/proto }
      type: object
      required: [proto, address, port, process, user, exposure, ufw]
      properties:
        proto: { type: string }
        address: { type: string }
        port: { type: integer }
        process: { type: string }
        user: { type: string }
        exposure: { type: string, enum: [all, local, other], description: all is every interface. local is loopback. }
        container: { type: string, description: Set when docker-proxy publishes this port for a container. }
        ufw: { type: string, description: 'allow, deny, or unmentioned when ufw is active. Empty otherwise.' }

    JobsReport:
      x-go-type: proto.JobsReport
      x-go-type-import: { path: github.com/nirajdilshan/easy-sys-admin/apps/esa/internal/hostops/proto }
      type: object
      required: [cron, timers]
      properties:
        cron: { type: array, items: { $ref: '#/components/schemas/CronEntry' } }
        timers: { type: array, items: { $ref: '#/components/schemas/Timer' } }

    CronEntry:
      x-go-type: proto.CronEntry
      x-go-type-import: { path: github.com/nirajdilshan/easy-sys-admin/apps/esa/internal/hostops/proto }
      type: object
      required: [source, user, schedule, command]
      properties:
        source: { type: string }
        user: { type: string }
        schedule: { type: string }
        command: { type: string }

    Timer:
      x-go-type: proto.Timer
      x-go-type-import: { path: github.com/nirajdilshan/easy-sys-admin/apps/esa/internal/hostops/proto }
      type: object
      required: [unit, activates, result, failed]
      properties:
        unit: { type: string }
        activates: { type: string }
        next: { type: string, format: date-time }
        last: { type: string, format: date-time }
        result: { type: string }
        failed: { type: boolean }

    # ---- Groups and runs ------------------------------------------------------------

    Day:
      type: string
      enum: [sun, mon, tue, wed, thu, fri, sat]

    CleanPolicy:
      type: object
      required: [enabled, days, time, buildCache, vscode, journal, journalSize]
      properties:
        enabled: { type: boolean, description: Run cleanups on the schedule. }
        days: { type: array, items: { $ref: '#/components/schemas/Day' } }
        time: { type: string, example: '03:30', description: HH:MM in the group's timezone. }
        buildCache: { type: boolean, description: Prune idle Docker build cache. }
        vscode: { type: boolean, description: Remove old VS Code server copies. }
        journal: { type: boolean, description: Cap the systemd journal. }
        journalSize: { type: string, example: 200M }

    UpdatePolicy:
      type: object
      required: [enabled, mode, days, time, hold, rebootIfRequired, batchSize, maxFailures]
      properties:
        enabled: { type: boolean }
        mode: { type: string, enum: [security, all] }
        days: { type: array, items: { $ref: '#/components/schemas/Day' } }
        time: { type: string, example: '04:00' }
        hold: { type: array, items: { type: string }, description: Packages never upgraded by esa. }
        rebootIfRequired: { type: boolean, description: Reboot each server after its update when the server asks for it. Never the control plane host. }
        batchSize:
          type: integer
          minimum: 1
          maximum: 50
          default: 1
          description: Servers updated or rebooted at the same time. The server that hosts the control plane always goes alone.
        maxFailures:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
          description: Stop the run once this many servers have failed. Checked after each batch, so the servers already running finish. 1 stops at the first failure.

    HealthCheck:
      type: object
      required: [name, kind, blocking]
      properties:
        name: { type: string, maxLength: 40 }
        kind: { type: string, enum: [tcp, http, unit, container] }
        blocking: { type: boolean, description: A blocking failure stops that server. An advisory failure is recorded and the upgrade continues. }
        port: { type: integer, minimum: 1, maximum: 65535 }
        tls: { type: boolean, description: 'For http, use HTTPS and verify the certificate. The name is the server enrolled address.' }
        method: { type: string, enum: [GET, HEAD] }
        path: { type: string, description: 'For http, a path on the enrolled server. It must start with a slash.' }
        unit: { type: string, description: A systemd service name. .service is added when omitted. }
        container: { type: string, description: A Docker container name. }

    GroupInput:
      type: object
      required: [name, timezone, clean, updates]
      properties:
        name: { type: string }
        timezone: { type: string, example: Asia/Colombo }
        clean: { $ref: '#/components/schemas/CleanPolicy' }
        updates: { $ref: '#/components/schemas/UpdatePolicy' }
        checks:
          type: array
          items: { $ref: '#/components/schemas/HealthCheck' }
          description: Run before and after a package upgrade. At most 8. Each dials this group's servers, never an address you type.

    Group:
      type: object
      required: [id, name, timezone, clean, updates, checks, serverCount, createdAt, lastRuns, access, yourRole]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        access: { $ref: '#/components/schemas/GroupAccess' }
        yourRole: { $ref: '#/components/schemas/EffectiveRole' }
        ownerTeam: { type: string, nullable: true, description: Set when another organization shares the group. }
        shareId: { type: integer, format: int64, nullable: true, description: Set when another team shares the group; removeGroupShare takes it. }
        timezone: { type: string }
        clean: { $ref: '#/components/schemas/CleanPolicy' }
        updates: { $ref: '#/components/schemas/UpdatePolicy' }
        checks:
          type: array
          items: { $ref: '#/components/schemas/HealthCheck' }
        serverCount: { type: integer }
        nextClean: { type: string, format: date-time, nullable: true }
        nextUpdate: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        lastRuns: { type: array, items: { $ref: '#/components/schemas/Run' } }

    GroupList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Group' } }

    RunKind:
      type: string
      enum: [measure, clean, update, reboot]

    RunOptions:
      x-go-type: fleet.RunOptions
      x-go-type-import: { path: github.com/nirajdilshan/easy-sys-admin/apps/esa/internal/fleet }
      type: object
      properties:
        buildCache: { type: boolean }
        vscode: { type: boolean }
        journal: { type: boolean }
        journalSize: { type: string }
        updateMode: { type: string, enum: [security, all] }
        hold: { type: array, items: { type: string } }
        rebootIfRequired: { type: boolean }
        batchSize:
          type: integer
          minimum: 1
          maximum: 50
          description: For update and reboot runs, servers worked on at the same time. Omit to use the group's setting (1 without a group).
        maxFailures:
          type: integer
          minimum: 1
          maximum: 1000
          description: For update and reboot runs, stop after this many servers fail. Omit to use the group's setting (1 without a group).
        checks:
          type: array
          items: { $ref: '#/components/schemas/HealthCheck' }
          description: Omit to keep the group's checks. An update copies them onto the run.
        canaryServerIds:
          type: array
          items: { type: integer, format: int64 }
          description: These servers run first. One failure among them skips the rest, even when the failure limit is higher.

    StartRunRequest:
      type: object
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/RunKind' }
        groupId: { type: integer, format: int64, nullable: true }
        serverIds: { type: array, items: { type: integer, format: int64 } }
        canaryServerIds:
          type: array
          items: { type: integer, format: int64 }
          description: On an update, these servers run first. One failure among them skips the rest.
        options:
          type: object
          allOf: [{ $ref: '#/components/schemas/RunOptions' }]
          nullable: true
          description: Overrides the group's settings. Omit to use them.

    RunServer:
      type: object
      required: [serverId, serverName, status, error, bytesFreed, detail]
      properties:
        serverId: { type: integer, format: int64 }
        serverName: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, skipped] }
        error: { type: string }
        bytesFreed: { type: integer, format: int64 }
        detail:
          type: object
          additionalProperties: true
          description: Cleanup report, upgrade result, or reboot outcome.
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }

    Run:
      type: object
      required: [id, kind, trigger, status, options, startedAt, summary, bytesFreed, servers]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: '#/components/schemas/RunKind' }
        trigger: { type: string, enum: [schedule, manual, api, mcp] }
        status: { type: string, enum: [running, succeeded, failed, partial, skipped, missed] }
        groupId: { type: integer, format: int64, nullable: true }
        groupName: { type: string, nullable: true }
        options: { $ref: '#/components/schemas/RunOptions' }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        summary: { type: string }
        bytesFreed: { type: integer, format: int64 }
        servers: { type: array, items: { $ref: '#/components/schemas/RunServer' } }

    RunList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Run' } }

    # ---- Alerts, channels, certificates ---------------------------------------------

    Alert:
      type: object
      required: [id, kind, subject, severity, message, pendingSince]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string }
        serverId: { type: integer, format: int64, nullable: true }
        serverName: { type: string, nullable: true }
        subject: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        message: { type: string }
        pendingSince: { type: string, format: date-time }
        firedAt: { type: string, format: date-time, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }

    AlertList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Alert' } }

    Incident:
      type: object
      required: [id, serverId, serverName, kind, subject, state, message, firstSeen, lastSeen]
      properties:
        id: { type: integer, format: int64 }
        serverId: { type: integer, format: int64 }
        serverName: { type: string }
        kind: { type: string }
        subject: { type: string }
        state: { type: string, enum: [open, acknowledged, snoozed] }
        snoozeUntil: { type: string, format: date-time, nullable: true }
        snoozeReason: { type: string }
        message: { type: string }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        ackedAt: { type: string, format: date-time, nullable: true }

    IncidentList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Incident' } }

    AlertRule:
      type: object
      required: [id, kind, enabled, threshold, forMinutes]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [disk, inode, memory, unreachable, failed_unit, container, reboot_required, cert_expiry, run_failed, host_key, exposure, new_port, new_key, security_update] }
        enabled: { type: boolean }
        threshold: { type: number, format: double, description: 'Percent for disk, inode, and memory; days for cert_expiry; unused otherwise.' }
        forMinutes: { type: integer, description: How long the condition must hold before the alert fires. }

    AlertRuleList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AlertRule' } }

    AlertRuleInput:
      type: object
      required: [enabled, threshold, forMinutes]
      properties:
        enabled: { type: boolean }
        threshold: { type: number, format: double }
        forMinutes: { type: integer }

    ChannelKind:
      type: string
      enum: [ntfy, webhook, discord, slack, email]

    ChannelConfig:
      x-go-type: fleet.ChannelConfig
      x-go-type-import: { path: github.com/nirajdilshan/easy-sys-admin/apps/esa/internal/fleet }
      type: object
      description: 'ntfy: url (with topic) and optional token. webhook: url and optional secret for an X-Esa-Signature HMAC. discord and slack: the incoming webhook url. email: smtpHost, smtpPort, username, password, from, to.'
      properties:
        url: { type: string }
        token: { type: string, format: password }
        secret: { type: string, format: password }
        smtpHost: { type: string }
        smtpPort: { type: integer }
        username: { type: string }
        password: { type: string, format: password }
        from: { type: string }
        to: { type: array, items: { type: string } }

    Channel:
      type: object
      required: [id, name, kind, enabled, target, lastError, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { $ref: '#/components/schemas/ChannelKind' }
        enabled: { type: boolean }
        target: { type: string, description: 'A description safe to show, without secrets.' }
        lastError: { type: string }
        lastSentAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    ChannelList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Channel' } }

    CreateChannelRequest:
      type: object
      required: [name, kind, config]
      properties:
        name: { type: string }
        kind: { $ref: '#/components/schemas/ChannelKind' }
        config: { $ref: '#/components/schemas/ChannelConfig' }

    UpdateChannelRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    Cert:
      type: object
      required: [id, hostname, port, issuer, lastError]
      properties:
        id: { type: integer, format: int64 }
        hostname: { type: string }
        port: { type: integer }
        expiresAt: { type: string, format: date-time, nullable: true }
        daysLeft: { type: integer, nullable: true }
        issuer: { type: string }
        lastError: { type: string }
        checkedAt: { type: string, format: date-time, nullable: true }

    CertList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Cert' } }

    AddCertRequest:
      type: object
      required: [hostname]
      properties:
        hostname: { type: string }
        port: { type: integer, default: 443 }

    # ---- Settings ----------------------------------------------------------------------

    Token:
      type: object
      required: [id, name, scopes, prefix, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
        prefix: { type: string, description: 'The first characters of the secret, to recognise it.' }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    TokenList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Token' } }

    CreateTokenRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
        expiresInDays: { type: integer, minimum: 1, maximum: 365, description: Days until the token expires. Absent means 90. }

    CreatedToken:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: '#/components/schemas/Token' }
        secret: { type: string, description: Shown only in this response. }

    ActivityEntry:
      type: object
      required: [id, action, target, source, userName, detail, createdAt]
      properties:
        id: { type: integer, format: int64 }
        action: { type: string }
        target: { type: string }
        source: { type: string, enum: [web, api, mcp, system] }
        userName: { type: string }
        detail: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }

    ActivityList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ActivityEntry' } }

    SSHKey:
      type: object
      required: [publicKey, fingerprint]
      properties:
        publicKey: { type: string }
        fingerprint: { type: string }
