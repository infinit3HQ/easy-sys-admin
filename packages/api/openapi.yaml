        yourRole: { $ref: '#/components/schemas/EffectiveRole' }
        ownerTeam: { type: string, nullable: true, description: Set when the server is in a group another organization shares. }
        host: { type: string }
        port: { type: integer }
        username: { type: string, description: 'SSH user the control plane uses, normally esa.' }
        groupId: { type: integer, format: int64, nullable: true }
        groupName: { type: string, nullable: true }
        enrollment: { type: string, enum: [pending, ready] }
        hostKeyFingerprint: { type: string }
        helperVersion: { type: string }
        arch: { type: string }
        hostsControlPlane: { type: boolean }
        protectedContainers:
          type: array
